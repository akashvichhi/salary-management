# The web container: the built app and the API on one origin, as FastAPI serves them on Render
# (api/app/core/web_app.py), so the httpOnly session cookie and the origin check work unchanged.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Docker's DNS, asked again every 10 s: a plain `proxy_pass http://api:8000` looks the name
        # up once at startup, so a rebuilt API container with a new IP would get 502s. With a
        # variable and no URI part, the request path passes through unchanged.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        # The browser's host, so the API's origin check sees a same-origin request.
        proxy_set_header Host $http_host;
        # Appends the caller's IP as the last entry, the one the API reads for the login rate
        # limit (TRUST_FORWARDED_FOR in docker-compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed file names: cached for a year. A missing asset is a 404, never index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route; no-cache, so a new build is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
