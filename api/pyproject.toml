[project]
name = "salary-management-api"
version = "0.1.0"
description = "API for managing employee salaries and salary insights"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.1",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
# Test folders have no __init__.py, so modules are named from the api/ root (tests.factories).
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["app"]
branch = true
